[project]
name = "kronos-ai"
version = "2.0.0a0"
description = "Financial Forecast & Probabilistic Decision Research Platform (Kronos-AI v2)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kronos-AI maintainers" }]
dependencies = [
    "baostock==0.9.4",
    "pandas>=2.1",
    "pydantic>=2.5,<3",
    "tzdata>=2026.4",
]

[project.scripts]
kronos-ai = "kronos_ai.cli.main:main"

[dependency-groups]
# Kronos 模型运行时依赖（vendor/ 下上游模型代码 + sampler 需要）。
# dev 组包含 model 组：sampler 可复现性回归测试属强制 CI 项（§54.2，DoD 32）。
model = [
    "einops>=0.7",
    "huggingface-hub>=0.23",
    "numpy>=1.26",
    "safetensors>=0.4",
    "torch>=2.2",
    "tqdm>=4.66",
]
dev = [
    { include-group = "model" },
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-tqdm",
    "pandas-stubs>=3.0.5.260914",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kronos_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib -m 'not integration and not benchmark'"
markers = [
    "integration: requires real model weights or network; skipped by default",
    "benchmark: long-running benchmark smoke tests; run on demand",
    "leakage: leakage guard tests; mandatory in CI",
    "regression: cross-implementation equivalence and raw-sample regressions; mandatory in CI",
]

[tool.coverage.run]
source = ["src/kronos_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# vendor 目录是上游代码的逐字节副本（见 ADR-020 与 vendor/UPSTREAM.md），
# 不施加本项目风格；v2 逻辑一律写在受控 adapter 中
extend-exclude = ["backend", "frontend", "src/kronos_ai/forecast/backends/kronos/vendor"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "RUF001", # 中文注释/字符串使用全角标点属正常技术写作
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["kronos_ai"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["kronos_ai"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
# vendor 目录是上游代码逐字节副本（ADR-020），不参与本项目类型门禁
module = ["kronos_ai.forecast.backends.kronos.vendor.*"]
ignore_errors = true
